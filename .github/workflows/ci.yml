name: Integración Continua (CI)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-tests:
    name: Pruebas Automatizadas Backend (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar suite de pruebas Pytest
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests -v

  frontend-tests:
    name: Pruebas Automatizadas Frontend (Flutter Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Instalar dependencias Flutter
        run: |
          cd frontend
          flutter pub get

      - name: Ejecutar pruebas de Frontend
        run: |
          cd frontend
          flutter test
